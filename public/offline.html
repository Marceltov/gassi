<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Keine Verbindung · Gassi</title>
    <style>
      :root { --bg: #e8ece3; --ink: #1e2a21; --muted: #5b685d; --primary: #2f6b45; --primary-ink: #fff; }
      @media (prefers-color-scheme: dark) { :root { --bg: #111813; --ink: #e4ebe1; --muted: #9aa79b; --primary: #7cc496; --primary-ink: #0d1f13; } }
      body { margin: 0; min-height: 100dvh; display: flex; flex-direction: column; justify-content: center; padding: 2rem 1.5rem; box-sizing: border-box; background: var(--bg); color: var(--ink); font-family: system-ui, sans-serif; line-height: 1.5; }
      h1 { font-size: 2rem; margin: 0 0 .5rem; }
      p { color: var(--muted); font-size: 1.125rem; margin: 0 0 2rem; max-width: 28rem; }
      button { min-height: 3.5rem; border: 0; border-radius: 1rem; background: var(--primary); color: var(--primary-ink); font: inherit; font-size: 1.125rem; font-weight: 700; }
    </style>
  </head>
  <body>
    <h1>Keine Verbindung</h1>
    <p>Gassi braucht Internet, um einzutragen und zu zeigen, was war. Sobald du wieder Netz hast, lade die Seite neu.</p>
    <button type="button" onclick="location.reload()">Neu laden</button>
  </body>
</html>
