name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # the Android app's native parts still fit its runtime version (#107, scripts/runtime.mjs)
      - run: npm run runtime:check

  # In Playwright's image, which has Chromium and its system packages: installing them took 7-11 minutes whenever the
  # runner got a slow Ubuntu mirror (#88). The tag is the installed Playwright's (tooling/ci.test.ts keeps them equal).
  e2e:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:e2e
      # Kept for a run that passed too: a test that failed once and passed on its retry leaves its trace only here.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # The image has no shell, so its entrypoint and health check are Node code that only a running container exercises.
  image-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: gassi:smoke
          cache-from: type=gha
      - name: Starts with nothing but PUBLIC_URL, turns healthy, prints the setup link and writes the database as the folder's owner
        run: |
          mkdir data
          docker run -d --name gassi -p 3000:3000 -v "$PWD/data:/data" -e PUBLIC_URL=http://localhost:3000 gassi:smoke
          for i in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' gassi)" = healthy ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' gassi | grep -qx healthy || { docker logs gassi; exit 1; }
          curl -fsS http://localhost:3000/health
          docker logs gassi 2>&1 | grep -q "Gassi einrichten: http://localhost:3000/l/" || { docker logs gassi; echo "::error::no setup link in the log"; exit 1; }
          owner=$(stat -c %u data/gassi.db)
          [ "$owner" = "$(id -u)" ] || { echo "::error::gassi.db belongs to uid $owner, not $(id -u)"; exit 1; }

  # main pushes build :main, :sha-<short> and :latest; vX.Y.Z tags build :X.Y.Z, :X.Y, :X and :latest.
  image:
    needs: [check, image-smoke]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # Derived from the repository (lower case), so it is ghcr.io/marceltov/gassi.
      - run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # the key as a file: build-push-action's `secrets:` splits into key=value lines and keeps only a PEM's first line
      - env:
          UPDATES_SIGNING_KEY: ${{ secrets.UPDATES_SIGNING_KEY }}
        run: printf '%s\n' "$UPDATES_SIGNING_KEY" > "$RUNNER_TEMP/updates_key.pem"
      - uses: docker/build-push-action@v6
        with:
          context: .
          # amd64 only: the homelab host is x86_64, and arm64 under QEMU took the job from ~2 to ~12 minutes.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # signs the Android app's update (#107, ADR 0015); a BuildKit secret, so it stays out of the image
          secret-files: |
            updates_key=${{ runner.temp }}/updates_key.pem

  # The Android APK for a new runtime version (#107, ADR 0015), guarded so it never spends EAS builds by itself: only
  # on main, only when no release apk-<runtime> exists yet (a JS change ships as an update, not an APK), only after
  # Marcel approves the `apk` environment, never at 12 or more builds this month, and one at a time. The image doesn't
  # wait for it; until the release exists the app says the new version follows.
  apk-needed:
    needs: [check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      runtime: ${{ steps.runtime.outputs.runtime }}
      needed: ${{ steps.runtime.outputs.needed }}
    steps:
      - uses: actions/checkout@v4
      - id: runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runtime=$(node -p 'require("./apps/mobile/app.json").expo.runtimeVersion')
          echo "runtime=$runtime" >> "$GITHUB_OUTPUT"
          if gh release view "apk-$runtime" >/dev/null 2>&1; then echo "needed=false"; else echo "needed=true"; fi >> "$GITHUB_OUTPUT"

  apk:
    # after the image and the e2e run: an APK built later than its image would outrank the image's update with older JS
    needs: [apk-needed, image, e2e]
    if: needs.apk-needed.outputs.needed == 'true'
    environment: apk
    concurrency:
      group: apk
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      RUNTIME: ${{ needs.apk-needed.outputs.runtime }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # a run that waited behind another one for the same runtime finds its release there; a run whose commit is no
      # longer main's newest leaves the build to the newest one, so the APK never carries older JS than the image
      - id: again
        run: |
          git fetch -q origin main
          if gh release view "apk-$RUNTIME" >/dev/null 2>&1 || [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then echo "built=true" >> "$GITHUB_OUTPUT"; fi
      - name: At most 12 EAS builds a month
        if: steps.again.outputs.built != 'true'
        working-directory: apps/mobile
        run: npx eas-cli build:list --platform android --limit 50 --json --non-interactive | node ../../scripts/eas-month.mjs 12
      - name: Build the APK on EAS
        if: steps.again.outputs.built != 'true'
        working-directory: apps/mobile
        run: npx eas-cli build -p android --profile release --non-interactive --wait --json > "$RUNNER_TEMP/build.json"
      - name: Publish it as the release apk-<runtime>
        if: steps.again.outputs.built != 'true'
        run: |
          url=$(node -p 'require(process.env.RUNNER_TEMP + "/build.json")[0].artifacts.buildUrl')
          curl -fsSL -o "gassi-$RUNTIME.apk" "$url"
          version=$(node -p 'require("./apps/mobile/app.json").expo.version')
          gh release create "apk-$RUNTIME" "gassi-$RUNTIME.apk" --target "$GITHUB_SHA" --title "Gassi $version for Android (runtime $RUNTIME)" \
            --notes "The Gassi APK for runtime $RUNTIME, built from $GITHUB_SHA. Install it over the old one; the app links here when its server needs it."
