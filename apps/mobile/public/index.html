<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <!-- Gassi's own page for the Expo web export (output "single"): installable (manifest, Apple tags), dark first,
         and the service worker that opens the app without reception after the first visit (sw.js). -->
    <meta name="description" content="Das Hundetagebuch für den Haushalt" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Gassi" />
    <meta name="theme-color" content="#111418" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f3f4f6" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        /* the app's background before it draws (theme.ts), so opening it doesn't flash white */
        background: #111418;
      }
      @media (prefers-color-scheme: light) {
        body {
          background: #f3f4f6;
        }
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <script>
      // not under `expo start` (port 8081): there the bundles change with every edit
      if ("serviceWorker" in navigator && location.port !== "8081") {
        window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
      }
    </script>
  </head>

  <body>
    <noscript>Gassi braucht JavaScript.</noscript>
    <div id="root"></div>
  </body>
</html>
